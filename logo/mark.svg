<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <!-- icon tile -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7f7"/>
      <stop offset="1" stop-color="#d6e0de"/>
    </linearGradient>
    <!-- glass body: clear centre, denser blue towards the rim -->
    <radialGradient id="glass" cx=".46" cy=".44" r=".58">
      <stop offset="0" stop-color="#b4d4f2" stop-opacity=".7"/>
      <stop offset=".42" stop-color="#7fabdd" stop-opacity=".85"/>
      <stop offset=".75" stop-color="#3f74b6" stop-opacity=".95"/>
      <stop offset="1" stop-color="#1b4583" stop-opacity="1"/>
    </radialGradient>
    <!-- light focused through the glass, glowing at the bottom -->
    <radialGradient id="focus" cx=".56" cy=".78" r=".46">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#e6f4ff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#e6f4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rimShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".6" stop-color="#1d3f72" stop-opacity="0"/>
      <stop offset="1" stop-color="#1d3f72" stop-opacity=".35"/>
    </linearGradient>
    <radialGradient id="crown" cx=".45" cy=".4" r=".7">
      <stop offset="0" stop-color="#0f2348"/>
      <stop offset=".7" stop-color="#1c3a6c"/>
      <stop offset="1" stop-color="#3d6aa6"/>
    </radialGradient>
    <!-- caustic shadow: blue tint with a bright core where light passes through -->
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2a5a98" stop-opacity=".5"/>
      <stop offset=".7" stop-color="#2a5a98" stop-opacity=".22"/>
      <stop offset="1" stop-color="#2e5f9c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="caustic" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#cfe6ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#cfe6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="hair" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation=".6"/></filter>

    <!-- one glass berry, centred at 0,0 with radius 100 -->
    <g id="berry">
      <circle r="100" fill="url(#glass)"/>
      <circle r="100" fill="url(#focus)"/>
      <circle r="100" fill="url(#rimShade)"/>
      <!-- environment reflected upside-down inside the glass: darker upper band -->
      <ellipse cx="0" cy="-8" rx="88" ry="40" fill="#163a70" fill-opacity=".22" filter="url(#soft2)"/>
      <!-- bright refracted rim along the bottom edge -->
      <path d="M-78 52 C-50 92 50 96 82 48" fill="none" stroke="#eaf6ff" stroke-opacity=".85" stroke-width="5" stroke-linecap="round" filter="url(#soft2)"/>
      <!-- inner refracted ring -->
      <circle r="86" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="3" filter="url(#hair)"/>
      <!-- crown: five rounded sepals, recessed -->
      <g transform="translate(-6 -50) scale(1 .78)">
        <circle r="38" fill="#0f2a55" fill-opacity=".35" filter="url(#soft2)"/>
        <circle r="35" fill="none" stroke="#cfe6ff" stroke-opacity=".55" stroke-width="3" filter="url(#hair)"/>
        <path fill="url(#crown)" d="M0 -31 C7 -31 9 -18 15 -15 C21 -12 31 -16 33 -9 C35 -2 24 4 23 11 C22 18 29 27 23 31 C17 35 8 26 0 26 C-8 26 -17 35 -23 31 C-29 27 -22 18 -23 11 C-24 4 -35 -2 -33 -9 C-31 -16 -21 -12 -15 -15 C-9 -18 -7 -31 0 -31 Z"/>
        <circle r="7" fill="#081630"/>
        <path d="M-26 -12 C-20 -24 -6 -30 6 -29" fill="none" stroke="#e8f4ff" stroke-opacity=".7" stroke-width="2.4" stroke-linecap="round" filter="url(#hair)"/>
      </g>
      <!-- specular highlights -->
      <!-- window reflection -->
      <path d="M-70 -34 C-66 -54 -50 -68 -32 -74 L-26 -58 C-40 -52 -50 -42 -54 -28 Z" fill="#fff" fill-opacity=".92"/>
      <ellipse cx="-36" cy="-18" rx="6" ry="4" fill="#fff" fill-opacity=".8"/>
      <ellipse cx="-58" cy="4" rx="5" ry="12" transform="rotate(-12 -58 4)" fill="#fff" fill-opacity=".6" filter="url(#hair)"/>
      <path d="M58 -62 C76 -44 86 -20 86 6" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="4" stroke-linecap="round" filter="url(#hair)"/>
      <!-- tiny bubbles trapped in the glass -->
      <circle cx="30" cy="22" r="4" fill="#fff" fill-opacity=".25" stroke="#fff" stroke-opacity=".8" stroke-width="1.2"/>
      <circle cx="44" cy="40" r="2.4" fill="#fff" fill-opacity=".3" stroke="#fff" stroke-opacity=".7" stroke-width="1"/>
      <circle cx="-20" cy="48" r="3" fill="#fff" fill-opacity=".25" stroke="#fff" stroke-opacity=".7" stroke-width="1"/>
      <!-- crisp outer edge -->
      <circle r="99" fill="none" stroke="#1e467e" stroke-opacity=".35" stroke-width="2"/>
    </g>
  </defs>

  

  <!-- caustic shadows, cast down and right -->
  <g filter="url(#soft)">
    <ellipse cx="206" cy="408" rx="96" ry="30" fill="url(#shadow)"/>
    <ellipse cx="342" cy="398" rx="84" ry="26" fill="url(#shadow)"/>
    <ellipse cx="290" cy="300" rx="70" ry="22" fill="url(#shadow)" opacity=".6"/>
    <ellipse cx="222" cy="410" rx="34" ry="11" fill="url(#caustic)"/>
    <ellipse cx="354" cy="400" rx="28" ry="9" fill="url(#caustic)"/>
  </g>

  <!-- back berry, then two front berries -->
  <use href="#berry" transform="translate(266 186) scale(.9)"/>
  <use href="#berry" transform="translate(188 302) scale(1.02) rotate(-14)"/>
  <use href="#berry" transform="translate(334 300) scale(.86) rotate(16)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
